<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean, minimal dark theme with double M -->
  <defs>
    <!-- Very dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:1" />
    </linearGradient>

    <!-- Cool blue accent for the M letters -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="90" fill="url(#bgGrad)"/>

  <!-- Subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="82" fill="none" stroke="url(#mGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Double M - Bold, clean, modern -->
  <g filter="url(#glow)">
    <!-- First M -->
    <path d="M 100 340 L 100 172 L 145 240 L 190 172 L 190 340 L 160 340 L 160 240 L 145 265 L 130 240 L 130 340 Z"
          fill="url(#mGrad)"
          stroke="url(#mGrad)"
          stroke-width="2"/>

    <!-- Second M -->
    <path d="M 322 340 L 322 172 L 367 240 L 412 172 L 412 340 L 382 340 L 382 240 L 367 265 L 352 240 L 352 340 Z"
          fill="url(#mGrad)"
          stroke="url(#mGrad)"
          stroke-width="2"/>
  </g>

  <!-- Subtle connection line between the Ms -->
  <line x1="210" y1="256" x2="302" y2="256"
        stroke="url(#mGrad)"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- Small decorative dots -->
  <circle cx="256" cy="256" r="6" fill="url(#mGrad)" opacity="0.8"/>
  <circle cx="240" cy="256" r="3" fill="url(#mGrad)" opacity="0.5"/>
  <circle cx="272" cy="256" r="3" fill="url(#mGrad)" opacity="0.5"/>
</svg>

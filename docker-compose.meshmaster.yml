services:
  mesh-master:
    build: .
    image: mesh-master:latest
    container_name: mesh-master
    ports:
      - "5000:5000"
    privileged: true
    devices:
      - /dev/cu.usbmodem1101:/dev/cu.usbmodem1101
    environment:
      - MESH_INTERFACE=/dev/cu.usbmodem1101
    volumes:
      - ./config.json:/app/config.json:rw
      - ./commands_config.json:/app/commands_config.json:rw
      - ./data:/app/data:rw
      - ./mesh_master:/app/mesh_master:rw
      - ./mesh-master.py:/app/mesh-master.py:rw
      - ./static:/app/static:ro
      - ./motd.json:/app/motd.json:rw
      - ./feature_flags.json:/app/feature_flags.json:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
